spring.application.name=inversiones

spring.datasource.url=jdbc:postgresql://localhost:5432/inversiones
spring.datasource.username=inversiones
spring.datasource.password=inversiones
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Los BigDecimal se escriben sin notación científica: 0.00000000 en lugar de 0E-8.
spring.jackson.write.write-bigdecimal-as-plain=true

app.zona-horaria-negocio=America/Guayaquil
